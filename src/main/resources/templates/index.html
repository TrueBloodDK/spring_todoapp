<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Список дел</title>
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">Список бебр</h1>

    <form th:action="@{/add}" th:object="${newTodo}" method="post" class="mb-3">
        <div class="input-group">
            <input type="text" class="form-control" th:field="*{title}" placeholder="Введите задачу">
            <button class="btn btn-primary" type="submit">Добавить</button>
        </div>
    </form>

    <ul class="list-group">
        <li th:each="item : ${AllTodos}">
           <span th:text="${item.title}" class="list-group-item d-flex justify-content-between align-items-center"></span>
         </li>
    </ul>
</div>

</body>
</html>
